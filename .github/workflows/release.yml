name: Release

# Publishes the package to npm when a GitHub Release is published, then
# lists its MCP server in the MCP Registry (the mcp-registry job).
# The release tag (e.g. v0.1.0) must match the version in package.json.
#
# Authentication uses npm Trusted Publishing (OIDC) — no long-lived token.
# One-time setup on npmjs.com: on the package's Settings → Trusted Publisher,
# add this repo (benbalter/word-to-markdown-js) with workflow filename
# "release.yml". npm's UI requires the package to already exist, so the very
# first version must be published manually to claim the name (see CONTRIBUTING).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          # The pinned Node 24 bundles npm 11.x, which meets trusted
          # publishing's npm >= 11.5.1 requirement without a global upgrade.
          node-version-file: .nvmrc
          # No dependency cache in the publishing job: a poisoned cache entry
          # from another workflow must never reach what we ship.
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Verify the registry signatures/attestations of installed dependencies
      # before shipping — closes the loop on the provenance we ourselves emit.
      - name: Verify dependency signatures
        run: npm audit signatures
      - name: Verify tag matches package.json version
        # Pass the tag via env, never ${{ }} inside the script (template injection).
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$RELEASE_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package.json version $pkg" >&2
            exit 1
          fi
      # No separate build: the CLI tests rebuild build/ when it's missing, and
      # `prepack` rebuilds it clean for the publish.
      - run: npm test
      # No token: OIDC authenticates via id-token, and provenance is automatic.
      - run: npm publish

  # Lists the new version's MCP server (`w2m mcp`) in the official MCP
  # Registry (https://modelcontextprotocol.io/registry), which MCP clients and
  # directories read from. A separate job so a registry hiccup can be re-run
  # without republishing to npm. The registry stores only metadata and
  # validates it against the npm package just published, whose package.json
  # carries `mcpName`.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the registry; no stored secret
    env:
      # A release tag, not latest: this job holds an OIDC token.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      # Generated from package.json, so name and version have one source.
      - name: Generate server.json
        run: node scripts/mcp-server-json.mjs
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      # The registry looks the version up on npm, which can take a minute to
      # show a fresh publish, so retry for a while before failing.
      - name: Publish to the MCP Registry
        run: |
          for attempt in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            echo "Attempt $attempt failed; retrying in 20s" >&2
            sleep 20
          done
          exit 1
