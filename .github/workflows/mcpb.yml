name: MCP Bundle

# Builds word-to-markdown.mcpb, the one-click Claude Desktop install of the
# MCP server (`w2m mcp`), and attaches it to the GitHub Release, where the
# docs link to releases/latest/download/word-to-markdown.mcpb.
#
# Runs on each published release. To attach a bundle to a release cut
# before this workflow existed (or to rebuild one), run it by hand:
#   gh workflow run mcpb.yml -f tag=v0.7.0
# The bundle is built from the tag's code with this workflow's own
# scripts/pack-mcpb.mjs, so that works for a tag that predates the script.
#
# Its own file, not a job in release.yml, so npm Trusted Publishing (tied to
# release.yml) is untouched, and this job's write token never sits next to
# an npm OIDC token.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the bundle to (e.g. v0.7.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # gh release upload
    env:
      # One place to resolve the tag, whichever way the run started.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag like v1.2.3, got '$TAG'" >&2
            exit 1
          fi
      # The packing script, from this workflow's commit.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: tooling
          sparse-checkout: scripts
      # The code to bundle, from the release tag.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.TAG }}
          path: release
      - uses: actions/setup-node@v7
        with:
          node-version-file: release/.nvmrc
          # No dependency cache: a poisoned cache entry from another workflow
          # must never reach what we ship.
          package-manager-cache: false
      - name: Check the tag matches package.json
        working-directory: release
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: npm ci
        working-directory: release
      - run: npm audit signatures
        working-directory: release
      # Builds, validates, packs, then unpacks the bundle and converts a
      # fixture with it before anything is uploaded.
      - run: node tooling/scripts/pack-mcpb.mjs release
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/word-to-markdown.mcpb --clobber --repo "$GITHUB_REPOSITORY"
