name: Scorecard

# OpenSSF Scorecard: supply-chain security posture for a published package.
# Results go to the Security tab (SARIF) and, via publish_results, to the public
# OpenSSF registry that backs the score badge. Report-only — never gates.

on:
  branch_protection_rule:
  schedule:
    # Weekly, matching the other security scans.
    - cron: '30 1 * * 0'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write # publish results to the OpenSSF registry (badge)
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
          category: scorecard
