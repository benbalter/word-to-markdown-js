name: CI
permissions:
  contents: read

# Run on pushes to main (post-merge) and on every PR — including forks, which
# `push` alone would skip. Scoping `push` to main avoids double runs on branches
# that also have an open PR.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so rapid pushes don't stack up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      # Critical advisories gate the build — those warrant blocking. High and
      # below stay advisory: Renovate handles remediation, and transitive,
      # unfixable advisories shouldn't block unrelated PRs (visible red, no gate).
      - name: Audit dependencies (critical, blocking)
        run: npm audit --audit-level=critical
      - name: Audit dependencies (high, advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
      # Static checks first: they're fast and need no build, so a lint or knip
      # failure shows up in a minute, not after the full build and test run.
      # (They stay in this job because `build` is the required status check.)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      # Builds build/ (the CLI tests run it) and dist/ (handed to e2e below).
      - run: npm run build
      - run: npm run test
      # Bundle the Worker the way Cloudflare's deploy does, so a bundling error
      # fails here instead of on deploy. The deploy uses `--prebuilt` because cf
      # detects Astro and would otherwise run bare `astro build` instead of
      # `npm run build`. cf-wrangler (shipped in wrangler) writes the bundle to
      # .cloudflare/output; the dry run needs no credentials. Both CLIs are
      # pinned devDependencies, so the lockfile (and npm audit) covers them.
      - name: Check Worker bundle
        run: |
          npx cf-wrangler build
          npx cf deploy --prebuilt --dry-run
      # Hand the built site to the e2e job so it doesn't rebuild it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  # The package supports Node >= 22.13 (package.json engines); the build job
  # covers the pinned Node 24. Test the minimum and the newest release too.
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '26']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: npm run test:e2e
      # Preserve the Playwright HTML report and traces so failed e2e runs are
      # debuggable from the Actions run instead of only reproducible locally.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
