name: CI
permissions:
  contents: read

# Run on pushes to main (post-merge) and on every PR — including forks, which
# `push` alone would skip. Scoping `push` to main avoids double runs on branches
# that also have an open PR.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so rapid pushes don't stack up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      # Critical advisories gate the build — those warrant blocking. High and
      # below stay advisory: Renovate handles remediation, and transitive,
      # unfixable advisories shouldn't block unrelated PRs (visible red, no gate).
      - name: Audit dependencies (critical, blocking)
        run: npm audit --audit-level=critical
      - name: Audit dependencies (high, advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
      # Static checks first: they're fast and need no build, so a lint or knip
      # failure shows up in a minute, not after the full build and test run.
      # (They stay in this job because `build` is the required status check.)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      # Builds build/ (the CLI tests run it) and dist/ (handed to e2e below).
      - run: npm run build
      - run: npm run test
      # Bundle the Worker the way Cloudflare's deploy does, so a bundling error
      # fails here instead of on deploy. Wrangler is a pinned devDependency, so
      # the lockfile (and npm audit) covers it.
      - name: Check Worker bundle
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      # Install the packed tarball the way a user would, so a module missing
      # from package.json `files` (or a broken `exports`/`bin`) fails here
      # instead of after `npm publish`. The tests above run the source tree,
      # which can't catch that.
      - name: Smoke-test the packed package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/pack-test"
          cd "$RUNNER_TEMP/pack-test"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/word-to-markdown-*.tgz
          node -e "import('word-to-markdown').then((m) => { if (typeof m.default !== 'function') throw new Error('no default export'); })"
          ./node_modules/.bin/w2m --version
      # Hand the built site to the e2e job so it doesn't rebuild it.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # The package supports Node >= 22.13 (package.json engines); the build job
  # covers the pinned Node 24. Test the minimum and the newest release too.
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '26']

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm run test:e2e
      # Preserve the Playwright HTML report and traces so failed e2e runs are
      # debuggable from the Actions run instead of only reproducible locally.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
