name: CI
permissions:
  contents: read

# Run on pushes to main (post-merge) and on every PR — including forks, which
# `push` alone would skip. Scoping `push` to main avoids double runs on branches
# that also have an open PR.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so rapid pushes don't stack up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run check-builds
      - run: npm run test
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
